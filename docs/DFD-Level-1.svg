  <text class="label" x="320" y="283">Sign-in result</text>
  <text class="label" x="825" y="237">Account data</text>
  <text class="label" x="790" y="304">Lookup</text>
  <text class="label" x="1080" y="312">Verification / recovery request</text>
  <text class="label" x="1020" y="355">Email code</text>

