<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1980" viewBox="0 0 1800 1980" role="img" aria-labelledby="title description">
  <title id="title">DFD Level 1 - Bella Vista Oasis Spa</title>
  <desc id="description">A readable Level 1 data flow diagram showing guest accounts, booking, manual GCash payment, manager verification, reservation operations, and status viewing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#426653"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#b18435"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20372c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #62736a; }
      .boundary { fill: #fbfcfa; stroke: #76917f; stroke-width: 2; stroke-dasharray: 10 8; }
      .boundary-label { font-size: 18px; font-weight: 700; letter-spacing: .5px; fill: #426653; }
      .entity { fill: #fff; stroke: #314d3d; stroke-width: 2.4; }
      .entity-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .entity-detail { font-size: 15px; fill: #62736a; text-anchor: middle; }
      .process { fill: #eaf2ec; stroke: #426653; stroke-width: 2.3; }
      .process-number { fill: #426653; }
      .process-number-text { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #fff; }
      .process-title { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .process-detail { font-size: 15px; fill: #62736a; text-anchor: middle; }
      .store-line { stroke: #617c69; stroke-width: 2; }
      .store-id { font-size: 16px; font-weight: 700; fill: #426653; }
      .store-title { font-size: 18px; font-weight: 700; }
      .store-detail { font-size: 15px; fill: #62736a; }
      .flow { fill: none; stroke: #426653; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .external-flow { fill: none; stroke: #b18435; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow-gold); stroke-linecap: round; stroke-linejoin: round; }
      .label { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #33483a; paint-order: stroke; stroke: #fbfcfa; stroke-width: 6px; stroke-linejoin: round; }
      .note { fill: #fff8e9; stroke: #d7bc7a; stroke-width: 1.5; }
      .note-text { font-size: 15px; fill: #6a5424; }
    </style>
  </defs>

  <rect width="1800" height="1980" fill="#fff"/>
  <text class="title" x="900" y="38" text-anchor="middle">Data Flow Diagram - Level 1</text>
  <text class="subtitle" x="900" y="66" text-anchor="middle">Bella Vista Oasis Spa Booking and Manual GCash Payment System</text>

  <g>
    <rect class="entity" x="40" y="90" width="210" height="65" rx="4"/>
    <text class="entity-title" x="145" y="117">E1 Guest</text>
    <text class="entity-detail" x="145" y="140">manual payment</text>
  </g>
  <g>
    <rect class="entity" x="1510" y="90" width="220" height="65" rx="4"/>
    <text class="entity-title" x="1620" y="117">E4 GCash</text>
    <text class="entity-detail" x="1620" y="140">external wallet</text>
  </g>
  <path class="external-flow" d="M250 108 H1510"/>
  <path class="external-flow" d="M1510 137 H250"/>
  <text class="label" x="880" y="101">GCash transfer</text>
  <text class="label" x="880" y="151">Transaction receipt</text>

  <rect class="boundary" x="300" y="180" width="1180" height="1740" rx="18"/>
  <text class="boundary-label" x="330" y="211">BELLA VISTA WEB APPLICATION</text>

