  <rect class="note" x="330" y="1870" width="1120" height="34" rx="7"/>
  <text class="note-text" x="350" y="1893">Rectangles = external entities; rounded boxes = processes; parallel lines = data stores. Repeated E1/E3 and D2-D5 labels represent the same entities and stores. GCash is manual; no API or webhook is used.</text>
</svg>
