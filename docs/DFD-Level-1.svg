  <path class="flow" d="M390 290 H250"/>
  <path class="flow" d="M750 245 H900"/>
  <path class="flow" d="M900 280 H825 V310 H750"/>
  <path class="flow" d="M750 320 H1420 V245 H1510"/>
  <path class="flow" d="M1510 285 H1460 V370 H570 V340"/>
